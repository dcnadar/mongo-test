name: Push MongoDB Collection Data

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release tag version (e.g. v0.1, v0.2)"
        required: false
        default: "manual-run"

  # Auto-trigger when a new tag is pushed or a release is published
  push:
    tags:
      - 'v*.*'  # e.g. v0.1, v1.0
  release:
    types: [published]

jobs:
  import-to-mongodb:
    name: Import BSON Data to MongoDB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # required to fetch tags
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Import BSON data into MongoDB
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          DB_NAME: ${{secrets.DB_NAME }}
          FOLDER_NAME: ${{secrets.FOLDER_NAME }}
          RELEASE_VERSION: ${{ github.event.inputs.release_version || github.ref_name }}
          BATCH_SIZE: 1000
        run: |
          echo "------------------------------------"
          echo "🚀 Starting MongoDB import process"
          echo "Database: $DB_NAME"
          echo "Folder: $FOLDER_NAME"
          echo "Release Version: $RELEASE_VERSION"
          echo "------------------------------------"
          node save_all_json_to_mongo.js

      - name: Notify on success
        if: success()
        run: echo "✅ Successfully imported MongoDB data for release ${{ env.RELEASE_VERSION }}"

      - name: Notify on failure
        if: failure()
        run: echo "❌ MongoDB import failed for release ${{ env.RELEASE_VERSION }}"
